name: Apple mobile builds

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ipad, appletv]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install cmake
      - name: Configure unsigned device build
        run: cmake --preset ${{ matrix.target }} -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
      - name: Build
        run: cmake --build --preset ${{ matrix.target }} --parallel 3
      - name: Check app bundle
        run: ctest --test-dir _build_${{ matrix.target }} -C Release --output-on-failure
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent _build_${{ matrix.target }}/Release/EmptyEpsilon.app EmptyEpsilon-${{ matrix.target }}-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EmptyEpsilon-${{ matrix.target }}-unsigned
          path: EmptyEpsilon-${{ matrix.target }}-unsigned.zip
          if-no-files-found: error
          retention-days: 30
